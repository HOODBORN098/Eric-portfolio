<svg xmlns="http://www.w3.org/2000/svg" width="480" height="426" viewBox="0 0 480 426">
  <defs>
    <linearGradient id="clamsy-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <clipPath id="clamsy-round">
      <rect width="480" height="426" rx="14"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clamsy-round)">
    <rect width="480" height="426" fill="url(#clamsy-bg)"/>

    <!-- Browser chrome -->
    <rect width="480" height="34" fill="#000000"/>
    <circle cx="18" cy="17" r="4.5" fill="#ef4444"/>
    <circle cx="34" cy="17" r="4.5" fill="#f59e0b"/>
    <circle cx="50" cy="17" r="4.5" fill="#22c55e"/>
    <rect x="80" y="9" width="320" height="16" rx="8" fill="#222222"/>
    <text x="95" y="20.5" font-family="Arial, sans-serif" font-size="10" fill="#aaaaaa">clamsy.vercel.app</text>

    <!-- Top bar -->
    <rect x="0" y="34" width="480" height="24" fill="#0d0d0d"/>
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="8.5" fill="#eab308">INFO@CLAMSYSTUDIOS.COM | 0116460971 / 0701087376</text>

    <!-- App navigation -->
    <rect x="0" y="58" width="480" height="44" fill="#141414"/>
    <text x="20" y="85" font-family="Georgia, serif" font-weight="700" font-size="16" fill="#ffffff">CLAMSY STUDIOS</text>
    <text x="180" y="84" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">Home</text>
    <text x="225" y="84" font-family="Arial, sans-serif" font-size="10" fill="#aaaaaa">Who we are</text>
    <text x="295" y="84" font-family="Arial, sans-serif" font-size="10" fill="#aaaaaa">Our Programs</text>
    <text x="370" y="84" font-family="Arial, sans-serif" font-size="10" fill="#aaaaaa">Contact</text>

    <!-- Hero Content -->
    <text x="30" y="140" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#eab308">Professional support on</text>
    <text x="30" y="175" font-family="Georgia, serif" font-weight="700" font-size="24" fill="#ffffff">Post-Production &amp;</text>
    <text x="30" y="205" font-family="Georgia, serif" font-weight="700" font-size="24" fill="#ffffff">Editing Services</text>

    <text x="30" y="240" font-family="Arial, sans-serif" font-size="10" fill="#dddddd">✓ Advanced Color Grading &amp; Correction</text>
    <text x="30" y="260" font-family="Arial, sans-serif" font-size="10" fill="#dddddd">✓ Professional Photo Retouching</text>
    <text x="30" y="280" font-family="Arial, sans-serif" font-size="10" fill="#dddddd">✓ Audio Cleaning &amp; Sound Design</text>
    <text x="30" y="300" font-family="Arial, sans-serif" font-size="10" fill="#dddddd">✓ Motion Graphics &amp; Titles</text>

    <rect x="30" y="330" width="120" height="32" rx="6" fill="#eab308"/>
    <text x="50" y="350" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#000000">Explore Program</text>
  </g>
</svg>
